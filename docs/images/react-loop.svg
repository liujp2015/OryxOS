<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669"/>
    </marker>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="#fafafa"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">ReAct 循环运行时流程</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748b">Reason + Act · Agent 核心工作机制</text>

  <!-- ============= START: User Message ============= -->
  <g id="start">
    <rect x="450" y="100" width="200" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow2)"/>
    <text x="550" y="125" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">用户消息</text>
    <text x="550" y="143" text-anchor="middle" font-size="10" fill="#475569">CLI 输入 / REST POST</text>
  </g>

  <line x1="550" y1="155" x2="550" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ============= Channel ============= -->
  <g id="channel">
    <rect x="430" y="190" width="240" height="50" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="550" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">Channel Adapter</text>
    <text x="550" y="228" text-anchor="middle" font-size="10" fill="#64748b">CliChannel / ApiController</text>
  </g>

  <line x1="550" y1="240" x2="550" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ============= Step 1: Assemble Prompt ============= -->
  <g id="step1">
    <rect x="80" y="275" width="280" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="80" y="275" width="280" height="26" rx="10" fill="#f97316"/>
    <rect x="80" y="291" width="280" height="10" fill="#f97316"/>
    <text x="220" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Step 1 · 组装 Prompt</text>
    <text x="220" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">PromptBuilder</text>
    <text x="220" y="334" text-anchor="middle" font-size="10" fill="#475569">system + Bootstrap + Skill</text>
    <text x="220" y="348" text-anchor="middle" font-size="10" fill="#475569">+ Memory + History + Tools</text>
  </g>

  <!-- ============= Step 2: Call LLM ============= -->
  <g id="step2">
    <rect x="410" y="275" width="280" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="410" y="275" width="280" height="26" rx="10" fill="#f97316"/>
    <rect x="410" y="291" width="280" height="10" fill="#f97316"/>
    <text x="550" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Step 2 · 调用 LLM</text>
    <text x="550" y="318" text-anchor="middle" font-size="12" font-weight="600" fill="#9a3412">ProviderService.chat()</text>
    <text x="550" y="334" text-anchor="middle" font-size="10" fill="#475569">显式 name → ChatModel</text>
    <text x="550" y="348" text-anchor="middle" font-size="10" fill="#475569">记 llm_calls 审计</text>
  </g>

  <!-- ============= Step 3: Decision ============= -->
  <g id="step3">
    <rect x="740" y="275" width="280" height="80" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="740" y="275" width="280" height="26" rx="10" fill="#d97706"/>
    <rect x="740" y="291" width="280" height="10" fill="#d97706"/>
    <text x="880" y="293" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Step 3 · 决策判断</text>
    <text x="880" y="320" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">响应里有 Tool 调用？</text>
    <text x="880" y="340" text-anchor="middle" font-size="10" fill="#475569">Function Calling 解析</text>
  </g>

  <!-- Arrows: Channel → 3 parallel steps (showing control flow) -->
  <line x1="550" y1="240" x2="220" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <line x1="550" y1="240" x2="550" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#arrow2)"/>
  <line x1="550" y1="240" x2="880" y2="275" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Step 1 → Step 2 -->
  <line x1="360" y1="315" x2="410" y2="315" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow2)"/>
  <!-- Step 2 → Step 3 -->
  <line x1="690" y1="315" x2="740" y2="315" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- Decision: YES branch (down to ToolExecutor) -->
  <text x="900" y="372" font-size="11" font-weight="600" fill="#059669">Yes</text>
  <line x1="880" y1="355" x2="880" y2="410" stroke="#059669" stroke-width="2.5" marker-end="url(#arrow-green)"/>

  <!-- Decision: NO branch (right to final response) -->
  <text x="1030" y="318" font-size="11" font-weight="600" fill="#475569">No</text>
  <line x1="1020" y1="315" x2="1080" y2="315" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow2)"/>

  <!-- ============= Step 4: Execute Tool ============= -->
  <g id="step4">
    <rect x="700" y="415" width="360" height="120" rx="10" fill="#f0fdf4" stroke="#059669" stroke-width="2" filter="url(#shadow2)"/>
    <rect x="700" y="415" width="360" height="26" rx="10" fill="#059669"/>
    <rect x="700" y="431" width="360" height="10" fill="#059669"/>
    <text x="880" y="433" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Step 4 · 执行 Tool 调用</text>
    <text x="880" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#064e3b">ToolExecutor.execute()</text>
    <text x="880" y="482" text-anchor="middle" font-size="11" fill="#475569">1. SandboxChecker 白名单校验</text>
    <text x="880" y="498" text-anchor="middle" font-size="11" fill="#475569">2. ToolRegistry 查找 + 执行</text>
    <text x="880" y="514" text-anchor="middle" font-size="11" fill="#475569">3. 写 tool_invocations 审计表</text>
    <text x="880" y="530" text-anchor="middle" font-size="11" fill="#475569">4. 结果作为 tool 消息追加到 Session</text>
  </g>

  <!-- Tool execution feedback arrow: back to step 1 (loop) -->
  <line x1="700" y1="475" x2="360" y2="475" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <line x1="360" y1="475" x2="360" y2="355" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="220" y1="275" x2="220" y2="240" stroke="#ea580c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-orange)"/>
  <text x="450" y="465" font-size="11" font-weight="600" fill="#ea580c">回到 Step 1 继续循环 (MAX_ITERATIONS = 10)</text>

  <!-- ============= Step 5: Final Response ============= -->
  <g id="step5">
    <rect x="980" y="275" width="100" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow2)"/>
    <text x="1030" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">最终</text>
    <text x="1030" y="325" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">响应</text>
    <text x="1030" y="343" text-anchor="middle" font-size="10" fill="#475569">返回 Channel</text>
  </g>

  <!-- ============= Boundary annotation ============= -->
  <g id="boundary" font-size="11" fill="#475569">
    <rect x="50" y="610" width="1000" height="80" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5 3"/>
    <text x="70" y="635" font-size="13" font-weight="700" fill="#991b1b">⚠ Constitution 关键边界（不可违反）</text>
    <text x="70" y="660" font-size="11" fill="#7f1d1d">• Spring AI 只用一半：禁用自动 tool 执行，调度完全由 ReActLoop + ToolExecutor 控制</text>
    <text x="70" y="678" font-size="11" fill="#7f1d1d">• 审计表 day one 落库：llm_calls 和 tool_invocations 每次调用都写库（不只写日志）</text>
  </g>

  <!-- ============= Side annotations ============= -->
  <g id="side-info" font-size="10" fill="#64748b">
    <text x="60" y="708" font-style="italic">* 图中颜色：蓝色=接入层 · 橙色=引擎循环 · 绿色=Tool 路径 · 紫色=审计</text>
  </g>
</svg>